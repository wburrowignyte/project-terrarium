# Sample configuration — synthetic data only, for testing the plugin.
project:
  name: "Sample County Child Care Assistance"
  prefix: "CCA"
  database: "Oracle"
  appian_tier: "Standard"
  # lookup_table: "CCA_LOOKUP"   # name for the shared lookup table (default <prefix>_LOOKUP); its Kind must be Lookup

context_paths:
  - "docs/context/**/*.md"

sharepoint:
  transcript_folders: []    # empty: the sample uses local transcripts only
  transcript_queries: []
  folders: []
  doc_queries: []

local_inputs: "transcripts"                  # committed synthetic transcripts (a real project uses .project-terrarium/inputs)
staging_dir: ".project-terrarium/staging"

outputs:
  erd_dir: "erd"
