<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERD Viewer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1c2430;--muted:#657084;--border:#d6dbe3;--accent:#2563eb;--node:#fff;--node-border:#9aa5b5;--edge:#7b8698;--hl:#f59e0b;--match:#fde68a;
 --k-core:#2563eb;--k-ref:#0f8f7e;--k-junction:#7c3aed;--k-history:#b7791f;--k-other:#64748b;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#171e28;--text:#e3e8ef;--muted:#93a0b4;--border:#2b3544;--accent:#6ea0ff;--node:#1a2230;--node-border:#4a5a70;--edge:#7f8da3;--hl:#fbbf24;--match:#6b5a12;
 --k-core:#5b8cff;--k-ref:#2bb5a1;--k-junction:#a78bfa;--k-history:#e0a43a;--k-other:#8a97ab;--warn:#fbbf24}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:1px 9px;color:var(--muted);font-size:12px}
.tabs{margin-left:auto;display:flex;gap:2px}
.tab{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tab[aria-selected=true]{background:var(--bg);color:var(--text);font-weight:600}
main{flex:1;min-height:0;display:flex}
aside{background:var(--panel);overflow:auto}
#filters{width:230px;border-right:1px solid var(--border);padding:12px;flex:none}
#detail{width:360px;border-left:1px solid var(--border);padding:14px;flex:none;display:none}
#detail.open{display:block}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}h3:first-child{margin-top:0}
label.row{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
button.btn{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
button.btn:hover{border-color:var(--accent)}
select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px;font:inherit;width:100%}
#results{margin:6px 0 0;max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;display:none}
#results div{padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--border)}#results div:last-child{border:0}#results div:hover,#results .active{background:var(--bg)}
#results small{color:var(--muted)}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
svg#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:var(--bg)}svg#svg.drag{cursor:grabbing}
.toolbar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
#mini{position:absolute;right:12px;bottom:12px;width:200px;height:140px;background:var(--panel);border:1px solid var(--border);border-radius:8px;opacity:.95}
#status{position:absolute;left:12px;top:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--muted);font-size:12px}
.page{display:none;flex:1;overflow:auto;padding:20px 28px}.page.open{display:block}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--bg);font-weight:600;font-size:12px}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.badge{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;border:1px solid var(--border)}
.badge.PII,.badge.PHI,.badge.FTI,.badge.CJI{background:var(--warn);color:#fff;border-color:transparent}
#detail h2{font-size:16px;margin:0 0 2px}#detail .sub{color:var(--muted);margin-bottom:8px}
#detail dl{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin:8px 0}#detail dt{color:var(--muted)}#detail dd{margin:0}
#detail{width:400px;overflow-x:hidden}#detail table{table-layout:fixed;word-break:break-word}#detail td,#detail th{padding:3px 6px;font-size:12px}#detail .rt td:nth-child(1){width:48px}#detail .rt td:nth-child(2){width:64px}
.link{color:var(--accent);cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}
.warnlist li{margin:4px 0}.empty{color:var(--muted)}
@media print{header,#filters,#detail,.toolbar,#mini,#status{display:none!important}svg#svg{height:100vh}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><div class="chips" id="chips"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main>
  <aside id="filters">
    <h3>Search</h3>
    <input type="search" id="q" placeholder="Entity or column…  ( / )" autocomplete="off" aria-label="Search entities and columns">
    <div id="results" role="listbox"></div>
    <h3>Kind</h3><div id="kinds"></div>
    <h3>Sensitivity</h3><div id="sens"></div>
    <h3>Fields shown</h3>
    <select id="fieldmode"><option value="keys">Key fields only</option><option value="all">All fields</option><option value="none">Names only</option></select>
    <h3>Relationship lines</h3>
    <select id="edgemode"><option value="all">Always show all</option><option value="selected">Only for selected / matched</option></select>
    <h3>Focus</h3>
    <select id="hops"><option value="1">Selected + 1 hop</option><option value="2">Selected + 2 hops</option><option value="3">Selected + 3 hops</option></select>
    <div style="margin-top:6px;display:flex;gap:6px"><button class="btn" id="focusbtn">Focus selected</button><button class="btn" id="showall">Show all</button></div>
    <label class="row" style="margin-top:10px"><input type="checkbox" id="isolated" checked> Show entities with no relationships</label>
    <label class="row" id="deprow"><input type="checkbox" id="deprecated" checked> Show deprecated <small id="depn" style="color:var(--muted)"></small></label>
  </aside>
  <div id="stage" class="page-diagram">
    <svg id="svg" role="img" aria-label="Entity relationship diagram"><g id="vp"></g></svg>
    <div id="status"></div>
    <div class="toolbar">
      <button class="btn" id="fit" title="Fit all (f)">Fit</button>
      <button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button>
      <button class="btn" id="exsvg">Export SVG</button><button class="btn" id="expng">Export PNG</button>
    </div>
    <svg id="mini"></svg>
  </div>
  <aside id="detail"></aside>
  <section class="page" id="page-questions"></section>
  <section class="page" id="page-assumptions"></section>
  <section class="page" id="page-notes"></section>
</main>
<script>
const MODEL = /*__MODEL__*/null;
</script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const ents = MODEL.entities, rels = MODEL.relationships;
const byId = new Map(ents.map((e) => [e.id, e]));
const nbrs = new Map(ents.map((e) => [e.id, new Set()]));
const relsOf = new Map(ents.map((e) => [e.id, []]));
for (const r of rels) { nbrs.get(r.from)?.add(r.to); nbrs.get(r.to)?.add(r.from); relsOf.get(r.from)?.push(r); if (r.to !== r.from) relsOf.get(r.to)?.push(r); }
const kindOf = (e) => { const k = (e.kind || '').toLowerCase(); return k.startsWith('core') ? 'Core' : k.startsWith('ref') ? 'Reference' : k.startsWith('junc') ? 'Junction' : k.startsWith('hist') || k.startsWith('audit') ? 'History/Audit' : 'Unspecified'; };
const kindVar = { 'Core': '--k-core', 'Reference': '--k-ref', 'Junction': '--k-junction', 'History/Audit': '--k-history', 'Unspecified': '--k-other' };
const sensOf = (e) => { const m = (e.sensitivity || '').match(/PHI|PII|FTI|CJI/g); return m ? [...new Set(m)] : []; };
const SENS = ['PHI', 'PII', 'FTI', 'CJI'];

/* ---------- state ---------- */
const state = { kinds: new Set(), sens: new Set(), fieldMode: ents.length > 40 ? 'none' : 'all', selected: null, focus: null, matches: new Set(), showIsolated: true, showDeprecated: true, edgeMode: rels.length > 80 ? 'selected' : 'all', tx: 0, ty: 0, k: 1 };
const allKinds = [...new Set(ents.map(kindOf))];
allKinds.forEach((k) => state.kinds.add(k));
SENS.concat(['None']).forEach((s) => state.sens.add(s));
$('#fieldmode').value = state.fieldMode; $('#edgemode').value = state.edgeMode;
$('#edgemode').addEventListener('change', (e) => { state.edgeMode = e.target.value; restyle(); });

/* ---------- header / pages ---------- */
document.title = MODEL.title + ' — ERD viewer';
$('#title').textContent = MODEL.title;
const chips = [`${ents.length} entities`, `${rels.length} relationships`];
for (const k of ['Version', 'Last updated', 'Target database', 'Status']) if (MODEL.meta[k]) chips.push(`${k}: ${MODEL.meta[k]}`);
$('#chips').innerHTML = chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('');
const tabs = [['diagram', 'Diagram'], ['questions', `Open questions (${MODEL.questions.length})`], ['assumptions', `Assumptions (${MODEL.assumptions.length})`], ['notes', `Summary & warnings (${MODEL.warnings.length})`]];
$('#tabs').innerHTML = tabs.map(([id, t]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${id === 'diagram'}">${esc(t)}</button>`).join('');
function tableHtml(rows, empty) {
  if (!rows.length) return `<p class="empty">${empty}</p>`;
  const cols = Object.keys(rows[0]);
  return `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
$('#page-questions').innerHTML = `<h2>Open questions</h2>${tableHtml(MODEL.questions, 'None recorded.')}`;
$('#page-assumptions').innerHTML = `<h2>Assumptions</h2>${tableHtml(MODEL.assumptions, 'None recorded.')}`;
$('#page-notes').innerHTML = `<h2>Summary</h2><p>${esc(MODEL.summary) || '<span class="empty">None.</span>'}</p>` +
  `<h2>Parser warnings</h2>${MODEL.warnings.length ? `<ul class="warnlist">${MODEL.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : '<p class="empty">None.</p>'}` +
  (MODEL.changeLog.length ? `<h2>Change log</h2>${tableHtml(MODEL.changeLog, '')}` : '') +
  (MODEL.deferred ? `<h2>Out of scope / deferred</h2><pre style="white-space:pre-wrap;font:inherit">${esc(MODEL.deferred)}</pre>` : '');
function showTab(id) {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === id));
  const diagram = id === 'diagram';
  $('#stage').style.display = diagram ? '' : 'none'; $('#filters').style.display = diagram ? '' : 'none';
  $('#detail').style.display = diagram ? '' : 'none';
  for (const p of ['questions', 'assumptions', 'notes']) $('#page-' + p).classList.toggle('open', p === id);
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });

/* ---------- filters UI ---------- */
$('#kinds').innerHTML = allKinds.map((k) => `<label class="row"><input type="checkbox" data-kind="${esc(k)}" checked><span class="sw" style="background:var(${kindVar[k]})"></span>${esc(k)} <small style="color:var(--muted)">${ents.filter((e) => kindOf(e) === k).length}</small></label>`).join('');
$('#sens').innerHTML = SENS.concat(['None']).map((s) => `<label class="row"><input type="checkbox" data-sens="${s}" checked>${s === 'None' ? 'None / unspecified' : s} <small style="color:var(--muted)">${ents.filter((e) => (sensOf(e).length ? sensOf(e).includes(s) : s === 'None')).length}</small></label>`).join('');
$('#kinds').addEventListener('change', (e) => { const k = e.target.dataset.kind; e.target.checked ? state.kinds.add(k) : state.kinds.delete(k); rebuild(true); });
$('#sens').addEventListener('change', (e) => { const k = e.target.dataset.sens; e.target.checked ? state.sens.add(k) : state.sens.delete(k); rebuild(true); });
$('#fieldmode').addEventListener('change', (e) => { state.fieldMode = e.target.value; rebuild(true); });
const depCount = ents.filter((e) => e.deprecated).length;
if (!depCount) $('#deprow').style.display = 'none'; else $('#depn').textContent = depCount;
$('#deprecated').addEventListener('change', (e) => { state.showDeprecated = e.target.checked; rebuild(true); });
$('#isolated').addEventListener('change', (e) => { state.showIsolated = e.target.checked; rebuild(true); });
$('#focusbtn').addEventListener('click', () => { if (state.selected) { state.focus = { id: state.selected, hops: +$('#hops').value }; rebuild(true); } });
$('#showall').addEventListener('click', () => { state.focus = null; rebuild(true); });

function visibleSet() {
  let ids = new Set();
  if (state.focus) {
    let frontier = new Set([state.focus.id]); ids = new Set(frontier);
    for (let i = 0; i < state.focus.hops; i++) { const nx = new Set(); frontier.forEach((id) => nbrs.get(id)?.forEach((n) => { if (!ids.has(n)) nx.add(n); })); nx.forEach((n) => ids.add(n)); frontier = nx; }
  } else ents.forEach((e) => ids.add(e.id));
  return new Set([...ids].filter((id) => {
    const e = byId.get(id);
    if (id !== state.selected && id !== state.focus?.id) {
      if (!state.kinds.has(kindOf(e))) return false;
      const s = sensOf(e); if (!(s.length ? s.some((x) => state.sens.has(x)) : state.sens.has('None'))) return false;
    }
    if (!state.showDeprecated && e.deprecated && id !== state.selected) return false;
    if (!state.showIsolated && !state.focus && nbrs.get(id).size === 0) return false;
    return true;
  }));
}

/* ---------- node sizing ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const F_TITLE = '600 12px system-ui,sans-serif', F_MONO = '11px ui-monospace,Menlo,Consolas,monospace';
const measure = (t, f) => { mctx.font = f; return mctx.measureText(t).width; };
const ROW = 16, HEAD = 34, MAXROWS = 30;
function fieldRows(e) {
  const f = e.fields;
  if (state.fieldMode === 'none') return { rows: [], more: 0 };
  let rows = state.fieldMode === 'keys' ? f.filter((x) => x.key) : f;
  const more = f.length - Math.min(rows.length, MAXROWS);
  rows = rows.slice(0, MAXROWS);
  return { rows, more };
}
const commonPrefix = (() => {
  const c = new Map(); ents.forEach((e) => { const t = e.table.split('_'); if (t.length > 1) c.set(t[0], (c.get(t[0]) || 0) + 1); });
  const [tok, n] = [...c.entries()].sort((a, b) => b[1] - a[1])[0] || [];
  return tok && n >= ents.length * 0.7 ? tok + '_' : '';
})();
function nameLines(e) {
  const name = commonPrefix && e.table.startsWith(commonPrefix) ? e.table.slice(commonPrefix.length) : e.table;
  const lines = []; let cur = '';
  for (const t of name.split('_')) { if (cur && (cur + '_' + t).length > 15) { lines.push(cur + '_'); cur = t; } else cur = cur ? cur + '_' + t : t; }
  lines.push(cur); return lines;
}
const F_NAME = '700 14px system-ui,sans-serif', LINE = 18;
function sizeNode(e) {
  if (state.fieldMode === 'none') {
    const lines = nameLines(e), sn = sensOf(e);
    const w = Math.ceil(Math.max(...lines.map((l) => measure(l, F_NAME))) + 26 + (sn.length ? 4 : 0));
    return { w: Math.max(w, 90), h: 14 + lines.length * LINE + (sn.length ? 16 : 0), rows: [], more: 0, lines };
  }
  const { rows, more } = fieldRows(e);
  const sn = sensOf(e);
  let w = measure(e.table, F_TITLE) + 28 + (sn.length ? 16 + sn.join('/').length * 6 : 0);
  for (const r of rows) w = Math.max(w, measure(r.column, F_MONO) + measure(r.type, F_MONO) + 78);
  w = Math.min(Math.max(Math.ceil(w), 190), 420);
  return { w, h: HEAD + (rows.length + (more > 0 ? 1 : 0)) * ROW + 8, rows, more };
}

/* ---------- layout: layered per component, shelf-packed ---------- */
function layout(nodes, edges) {
  // nodes: [{id,w,h}], edges: [{from(child),to(parent)}]
  const idx = new Map(nodes.map((n, i) => [n.id, n]));
  const adj = new Map(nodes.map((n) => [n.id, new Set()]));
  const parents = new Map(nodes.map((n) => [n.id, new Set()])), children = new Map(nodes.map((n) => [n.id, new Set()]));
  for (const e of edges) { if (e.from === e.to || !idx.has(e.from) || !idx.has(e.to)) continue; adj.get(e.from).add(e.to); adj.get(e.to).add(e.from); parents.get(e.from).add(e.to); children.get(e.to).add(e.from); }
  const seen = new Set(), comps = [];
  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const comp = [], st = [n.id]; seen.add(n.id);
    while (st.length) { const v = st.pop(); comp.push(v); adj.get(v).forEach((u) => { if (!seen.has(u)) { seen.add(u); st.push(u); } }); }
    comps.push(comp);
  }
  const placed = [];
  for (const comp of comps) placed.push(layoutComponent(comp, idx, parents, children));
  // shelf pack
  placed.sort((a, b) => b.w * b.h - a.w * a.h);
  const GAP = state.fieldMode === 'none' ? 40 : 80, totalArea = placed.reduce((s, c) => s + (c.w + GAP) * (c.h + GAP), 0);
  const target = Math.max(placed.reduce((m, c) => Math.max(m, c.w), 0), Math.sqrt(totalArea * 1.7));
  let x = 0, y = 0, rowH = 0;
  for (const c of placed) {
    if (x > 0 && x + c.w > target) { x = 0; y += rowH + GAP; rowH = 0; }
    for (const n of c.nodes) { n.x += x; n.y += y; }
    x += c.w + GAP; rowH = Math.max(rowH, c.h);
  }
  return nodes;
}
function layoutComponent(ids, idx, parents, children) {
  const set = new Set(ids), layer = new Map();
  // longest-path layering with cycle breaking (DFS; back edges ignored)
  const state_ = new Map(), order = [];
  const dfs = (v) => { state_.set(v, 1); for (const c of children.get(v)) { if (!set.has(c)) continue; const s = state_.get(c); if (s === 1) continue; if (!s) dfs(c); } state_.set(v, 2); order.push(v); };
  ids.filter((v) => !parents.get(v).size).concat(ids).forEach((v) => { if (!state_.get(v)) dfs(v); });
  const topo = order.reverse(), pos = new Map(topo.map((v, i) => [v, i]));
  for (const v of topo) {
    let l = 0;
    for (const p of parents.get(v)) if (set.has(p) && pos.get(p) < pos.get(v)) l = Math.max(l, (layer.get(p) ?? 0) + 1);
    layer.set(v, l);
  }
  // pull pure roots down next to their lowest child so reference tables sit above their consumer
  for (const v of topo) if (![...parents.get(v)].some((p) => set.has(p) && pos.get(p) < pos.get(v))) {
    const cs = [...children.get(v)].filter((c) => set.has(c) && pos.get(c) > pos.get(v));
    if (cs.length) layer.set(v, Math.min(...cs.map((c) => layer.get(c))) - 1);
  }
  const minL = Math.min(...layer.values()); layer.forEach((l, v) => layer.set(v, l - minL));
  const L = []; ids.forEach((v) => (L[layer.get(v)] ??= []).push(v));
  for (let i = 0; i < L.length; i++) L[i] ??= [];
  // order: barycenter sweeps
  const frac = new Map();
  const setFrac = () => L.forEach((row) => row.forEach((v, i) => frac.set(v, (i + 0.5) / row.length)));
  setFrac();
  const nb = (v) => [...parents.get(v), ...children.get(v)].filter((u) => set.has(u));
  for (let it = 0; it < 8; it++) {
    const down = it % 2 === 0;
    const rows = down ? L.map((_, i) => i) : L.map((_, i) => L.length - 1 - i);
    for (const i of rows) {
      const key = new Map();
      for (const v of L[i]) {
        const ref = nb(v).filter((u) => (down ? layer.get(u) < i : layer.get(u) > i));
        key.set(v, ref.length ? ref.reduce((s, u) => s + frac.get(u), 0) / ref.length : frac.get(v));
      }
      L[i].sort((a, b) => key.get(a) - key.get(b));
      L[i].forEach((v, j) => frac.set(v, (j + 0.5) / L[i].length));
    }
  }
  // coordinates: wrap wide layers into sub-rows
  const compact = state.fieldMode === 'none', XGAP = compact ? 22 : 36, YGAP = compact ? 36 : 70, BUDGET = 2600, out = [];
  let y = 0, maxW = 0; const rowsOut = [];
  for (const row of L) {
    const subs = []; let cur = [], w = 0;
    for (const v of row) { const n = idx.get(v); if (cur.length && w + n.w + XGAP > BUDGET) { subs.push(cur); cur = []; w = 0; } cur.push(n); w += n.w + XGAP; }
    if (cur.length) subs.push(cur);
    for (const s of subs) {
      const w2 = s.reduce((t, n) => t + n.w, 0) + XGAP * (s.length - 1), h = Math.max(...s.map((n) => n.h));
      rowsOut.push({ s, w: w2, y, h }); y += h + YGAP; maxW = Math.max(maxW, w2);
    }

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

window.__erd = { state, rebuild, goTo, select, get scene() { return scene; } };
showTab('diagram');
rebuild(true);
})();
